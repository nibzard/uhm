[package]
name = "uhm-cli"
version = "0.2.1"
edition = "2021"
rust-version = "1.82"
authors = ["Nikola Balic"]
description = "A fast natural-language layer over terminal tools."
license = "MIT"
readme = "README.md"
repository = "https://github.com/nibzard/uhm"
homepage = "https://github.com/nibzard/uhm"
documentation = "https://github.com/nibzard/uhm#readme"
keywords = ["cli", "terminal", "openai", "shell", "productivity"]
categories = ["command-line-utilities", "development-tools"]
include = [
  "src/**",
  "assets/shell/**",
  "tests/**",
  "Cargo.toml",
  "Cargo.lock",
  "README.md",
  "LICENSE",
  "SECURITY.md",
  "PRIVACY.md",
  "config.example.yaml",
  "docs/behavior-contract.md",
  "docs/local-history.md",
  "docs/recovery.md",
  "docs/shell-integration.md",
]

[[bin]]
name = "uhm"
path = "src/main.rs"

[dependencies]
blake3 = "=1.5.5"
fs2 = "0.4"
libc = "0.2"
signal-hook = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
tempfile = "=3.13.0"
ureq = { version = "2", default-features = false, features = ["tls"] }
unicode-width = "0.2"

[profile.release]
panic = "unwind"   # raw-mode cleanup relies on Drop running
opt-level = 2
strip = true
lto = "thin"
codegen-units = 1
