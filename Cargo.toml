[package]
name = "uhm-cli"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
authors = ["uhm"]
description = "A fast natural-language layer over terminal tools."
license = "MIT"
readme = "README.md"

[[bin]]
name = "uhm"
path = "src/main.rs"

[dependencies]
blake3 = "=1.5.5"
fs2 = "0.4"
libc = "0.2"
signal-hook = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
tempfile = "=3.13.0"
ureq = { version = "2", default-features = false, features = ["tls"] }

[profile.release]
panic = "unwind"   # raw-mode cleanup relies on Drop running
opt-level = 2
