[package]
name = "uhm-cli"
version = "0.4.0"
edition = "2021"
rust-version = "1.82"
authors = ["Nikola Balic"]
description = "A fast natural-language layer over terminal tools."
license = "MIT"
readme = "README.md"
repository = "https://github.com/nibzard/uhm"
homepage = "https://github.com/nibzard/uhm"
documentation = "https://github.com/nibzard/uhm#readme"
keywords = ["cli", "terminal", "openai", "shell", "productivity"]
categories = ["command-line-utilities", "development-tools"]
include = [
  "/src/*.rs",
  "/src/bin/*.rs",
  "/src/render/*.rs",
  "/src/provider/*.rs",
  "/model-qualification-policy-v1.json",
  "/model-qualification-manifest.json",
  "/model-qualification-holdout-v1.json",
  "/scripts/provider-bakeoff.py",
  "/scripts/provider-benchmark-report.py",
  "/scripts/qualification_policy.py",
  "/scripts/provider-qualification-manifest.py",
  "/scripts/test-private-ca-proxy.py",
  "/scripts/seal-qualification-holdout.py",
  "/benchmark/build-worker.sh",
  "/benchmark/schemas/*.json",
  "/benchmark/worker/worker.py",
  "/benchmark/worker/tool_manifest.py",
  "/benchmark/docker/Dockerfile",
  "/tests/fixtures/provider-execution-benchmark-v2.json",
  "/tests/fixtures/provider-execution-reference-actions-v4.json",
  "/assets/shell/uhm.bash",
  "/assets/shell/uhm.fish",
  "/assets/shell/uhm.zsh",
  "/tests/*.rs",
  "/Cargo.toml",
  "/Cargo.lock",
  "/README.md",
  "/LICENSE",
  "/SECURITY.md",
  "/PRIVACY.md",
  "/AI_POLICY.md",
  "/CONTRIBUTING.md",
  "/config.example.yaml",
  "/docs/*.md",
  "/docs/architecture/*.md",
  "/docs/explanation/*.md",
  "/docs/how-to/*.md",
  "/docs/reference/*.md",
  "/docs/releases/*.md",
  "/docs/tutorials/*.md",
  "/docs/demo/README.md",
  "/docs/demo/uhm-demo.gif",
  "/docs/demo/uhm-demo.svg",
]

[[bin]]
name = "uhm"
path = "src/main.rs"

[dependencies]
blake3 = "=1.5.5"
fs2 = "0.4"
libc = "0.2"
signal-hook = "0.3"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
tempfile = "=3.13.0"
ureq = { version = "2", default-features = false, features = ["tls"] }
unicode-width = "0.2"
url = "2"

[profile.release]
panic = "unwind"   # raw-mode cleanup relies on Drop running
opt-level = 2
strip = true
lto = "thin"
codegen-units = 1
