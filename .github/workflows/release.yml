name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Complete CI quality gate
    uses: ./.github/workflows/ci.yml

  validate:
    name: Validate tag and release tree
    needs: quality
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        name: Match tag to Cargo version
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          test "${GITHUB_REF_NAME}" = "v${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --all-targets --locked
      - run: cargo package --locked

  build:
    name: Build ${{ matrix.target }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - name: Install native musl compiler
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install behavioral test fixtures
        run: |
          if [ "${RUNNER_OS}" = Linux ]; then
            sudo apt-get update
            sudo apt-get install -y zsh fish tmux openssh-client
          else
            brew install fish tmux
          fi
      - name: Run native behavioral suite
        run: cargo test --all-targets --locked
      - name: Build release binary
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: cargo build --release --locked --target "${{ matrix.target }}"
      - name: Test release transport behind a private-CA CONNECT proxy
        run: |
          python3 scripts/test-private-ca-proxy.py \
            --binary "target/${{ matrix.target }}/release/uhm"
      - name: Archive release
        shell: bash
        run: |
          name="uhm-v${{ needs.validate.outputs.version }}-${{ matrix.target }}"
          mkdir -p "target/package/${name}"
          cp "target/${{ matrix.target }}/release/uhm" "target/package/${name}/uhm"
          cp LICENSE README.md "target/package/${name}/"
          tar -C target/package -czf "target/package/${name}.tar.gz" "${name}"
          mkdir -p target/smoke
          tar -C target/smoke -xzf "target/package/${name}.tar.gz"
          "target/smoke/${name}/uhm" --version | grep -Fx "uhm ${{ needs.validate.outputs.version }}"
      - name: Attest archive provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: target/package/*.tar.gz
      - name: Upload archive
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: target/package/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish immutable-ready GitHub Release
    needs: [validate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    # The `secrets` context is not allowed in a step-level `if`, so the signing
    # key is lifted into the job environment here and the Sign step's `if` reads
    # this env var. Empty (inert) until the maintainer adds UHM_RELEASE_SIGNING_KEY.
    env:
      UHM_RELEASE_SIGNING_KEY: ${{ secrets.UHM_RELEASE_SIGNING_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: dist/uhm-v${{ needs.validate.outputs.version }}.spdx.json
          upload-artifact: false
      - name: Verify release asset set
        shell: bash
        run: |
          test "$(find dist -maxdepth 1 -name '*.tar.gz' -type f | wc -l)" -eq 4
          (cd dist && sha256sum *.tar.gz > SHA256SUMS && sha256sum --check SHA256SUMS)
      - name: Prepare installer assets
        shell: bash
        run: |
          version="v${{ needs.validate.outputs.version }}"
          sed "s/^default_version=\"\"$/default_version=\"${version}\"/" docs/install.sh > dist/install.sh
          cp dist/install.sh "dist/install-${version}.sh"
          chmod 0755 dist/install.sh "dist/install-${version}.sh"
          sh -n dist/install.sh
      - name: Install release-signing toolchain
        run: sudo apt-get update && sudo apt-get install -y minisign
      - name: Sign checksum manifest
        # Produces a detached minisign (ed25519) signature over SHA256SUMS so the
        # updater can authenticate the manifest against the public key compiled
        # into src/update.rs before installing. Inert (skipped) until the
        # maintainer adds UHM_RELEASE_SIGNING_KEY; see docs/reference/release-signing.md.
        if: ${{ env.UHM_RELEASE_SIGNING_KEY != '' }}
        shell: bash
        run: |
          set -eu
          umask 077
          printf '%s' "$UHM_RELEASE_SIGNING_KEY" | base64 -d > "$RUNNER_TEMP/release-key.minisign"
          minisign -S -s "$RUNNER_TEMP/release-key.minisign" \
            -m dist/SHA256SUMS \
            -c "uhm ${{ github.ref_name }} SHA256SUMS" \
            -x dist/SHA256SUMS.minisig
          rm -f "$RUNNER_TEMP/release-key.minisign"
          test -s dist/SHA256SUMS.minisig
      - name: Verify the signature against the compiled-in key
        # Catches a signing pipeline wired out of lockstep before the tag ships:
        # a typo'd or comment-line key pasted into RELEASE_PUBLIC_KEY, a secret
        # that does not match the compiled constant, or a real key committed with
        # no signing secret. Each would ship a green release that every installed
        # binary fail-closes on. Skips harmlessly while the placeholder key is
        # still compiled in.
        shell: bash
        run: |
          set -eu
          compiled_key="$(python3 scripts/extract-release-key.py)"
          if [ "$compiled_key" = "REPLACE_WITH_MINISIGN_PUBLIC_KEY" ]; then
            echo "release signing not configured (placeholder key); skipping cross-check"
            exit 0
          fi
          test -f dist/SHA256SUMS.minisig || {
            echo "::error::RELEASE_PUBLIC_KEY is set but no SHA256SUMS.minisig was produced; set UHM_RELEASE_SIGNING_KEY"
            exit 1
          }
          minisign -V -P "$compiled_key" -m dist/SHA256SUMS -x dist/SHA256SUMS.minisig || {
            echo "::error::release signature does not verify against the compiled-in RELEASE_PUBLIC_KEY (keypair out of lockstep)"
            exit 1
          }
          echo "release signature verifies against the compiled-in key"
      - name: Attest checksum manifest
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/SHA256SUMS
      - name: Attest release SBOM
        uses: actions/attest-sbom@v3
        with:
          subject-path: dist/*.tar.gz
          sbom-path: dist/uhm-v${{ needs.validate.outputs.version }}.spdx.json
      - name: Create, validate, and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${GITHUB_REF_NAME}" --draft --verify-tag \
            --title "${GITHUB_REF_NAME}" --notes-file "docs/releases/v${{ needs.validate.outputs.version }}.md"
          gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
          expected_assets=8
          [ -f dist/SHA256SUMS.minisig ] && expected_assets=9
          test "$(gh release view "${GITHUB_REF_NAME}" --json assets --jq '.assets | length')" -eq "$expected_assets"
          gh release edit "${GITHUB_REF_NAME}" --draft=false --latest
