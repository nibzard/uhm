name: CI

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: Stable / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install supported shells and terminal fixtures (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh fish tmux openssh-client

      - name: Install supported shells and terminal fixtures (macOS)
        if: runner.os == 'macOS'
        run: brew install fish tmux

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Check documentation drift
        run: python3 scripts/check-docs.py

      - name: Check installer script syntax
        run: sh -n docs/install.sh

      - name: Test installer temporary-directory fallback
        run: sh scripts/test-installer.sh

      - name: Test installer rejects a tampered checksum
        run: sh scripts/test-installer-rejects-tampered-checksum.sh

      - name: Run Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Run tests
        run: cargo test --all-targets --locked

      - name: Build release binary
        run: cargo build --release --locked

      - name: Smoke-test installed binary
        run: |
          cargo install --path . --locked --root target/installed
          target/installed/bin/uhm --version

      - name: Package crate
        run: cargo package --locked

  actionlint:
    name: Lint workflow files
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install actionlint (pinned + checksum-verified)
        env:
          ACTIONLINT_VERSION: '1.7.12'
          # SHA-256 of actionlint_<ver>_linux_amd64.tar.gz, taken from that
          # release's checksums.txt. Update both fields together when bumping.
          ACTIONLINT_SHA256: '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8'
        run: |
          base="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"
          asset="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          # Fetch the tarball and the maintainer's published checksums file.
          curl -fsSL "${base}/${asset}" -o "${asset}"
          curl -fsSL "${base}/actionlint_${ACTIONLINT_VERSION}_checksums.txt" -o checksums.txt
          # Verify against the pinned hash AND the live published checksums line.
          # Explicit fetch (not the install-actionlint.bash script) so every byte
          # is visible and the version is locked to a checksum, not a moving tag.
          echo "${ACTIONLINT_SHA256}  ${asset}" | sha256sum -c -
          grep -F "${asset}" checksums.txt | sha256sum -c -
          # Install to RUNNER_TEMP and expose it on PATH for the next step.
          tar -xzf "${asset}" actionlint
          install -m 0755 actionlint "${RUNNER_TEMP}/actionlint"
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"

      - name: Lint GitHub Actions workflows
        # Catches invalid/unloadable workflow files — e.g. a `secrets` context
        # used in a step-level `if:` (the failure that blocked the v0.6.5
        # release) — before they can break a release. Because release.yml calls
        # this workflow via workflow_call, the gate also runs on every tag.
        # actionlint additionally runs shellcheck on `run:` blocks (preinstalled
        # on ubuntu-latest) for stricter bash checking.
        run: actionlint -color

  telemetry-worker:
    name: Telemetry Worker
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: telemetry-worker/package-lock.json

      - name: Install Worker dependencies
        run: npm ci
        working-directory: telemetry-worker

      - name: Test strict ingestion gateway
        run: npm test
        working-directory: telemetry-worker

  provider-runner:
    name: Provider runner contract
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install runner dependencies
        run: python -m pip install --disable-pip-version-check jsonschema

      - name: Check offline runner contract
        run: python3 scripts/provider-bakeoff.py --self-test

  demo-assets:
    name: Demo assets
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install pinned agg renderer
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/asciinema/agg/releases/download/v1.9.0/agg-x86_64-unknown-linux-gnu \
            --output "$RUNNER_TEMP/agg"
          chmod +x "$RUNNER_TEMP/agg"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Regenerate media without an API key
        run: scripts/record-demo.sh --render-only

      - name: Require byte-stable derived assets
        run: git diff --exit-code -- docs/demo/uhm-demo.svg docs/demo/uhm-demo.gif

  msrv:
    name: MSRV / Rust 1.89
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust 1.89
        uses: dtolnay/rust-toolchain@1.89

      - name: Check MSRV
        run: cargo check --all-targets --locked

  musl:
    name: Linux / musl release
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install musl toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install Rust and musl target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Build static release binary
        run: cargo build --release --locked --target x86_64-unknown-linux-musl

      - name: Test packaged transport behind a private-CA CONNECT proxy
        run: |
          python3 scripts/test-private-ca-proxy.py \
            --binary target/x86_64-unknown-linux-musl/release/uhm
