name: CI

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: Stable / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install supported shells and terminal fixtures (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh fish tmux openssh-client

      - name: Install supported shells and terminal fixtures (macOS)
        if: runner.os == 'macOS'
        run: brew install fish tmux

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Run tests
        run: cargo test --all-targets --locked

      - name: Build release binary
        run: cargo build --release --locked

      - name: Smoke-test installed binary
        run: |
          cargo install --path . --locked --root target/installed
          target/installed/bin/uhm --version

      - name: Package crate
        run: cargo package --locked

  telemetry-worker:
    name: Telemetry Worker
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: telemetry-worker/package-lock.json

      - name: Install Worker dependencies
        run: npm ci
        working-directory: telemetry-worker

      - name: Test strict ingestion gateway
        run: npm test
        working-directory: telemetry-worker

  demo-assets:
    name: Demo assets
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install pinned agg renderer
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/asciinema/agg/releases/download/v1.9.0/agg-x86_64-unknown-linux-gnu \
            --output "$RUNNER_TEMP/agg"
          chmod +x "$RUNNER_TEMP/agg"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Regenerate media without an API key
        run: scripts/record-demo.sh --render-only

      - name: Require byte-stable derived assets
        run: git diff --exit-code -- docs/demo/uhm-demo.svg docs/demo/uhm-demo.gif

  msrv:
    name: MSRV / Rust 1.82
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust 1.82
        uses: dtolnay/rust-toolchain@1.82

      - name: Check MSRV
        run: cargo check --all-targets --locked

  musl:
    name: Linux / musl release
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install musl toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install Rust and musl target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Build static release binary
        run: cargo build --release --locked --target x86_64-unknown-linux-musl
