name: Dependencies

# Decoupled supply-chain scan. Intentionally NOT referenced by ci.yml or
# release.yml: release.yml re-runs ci.yml as its quality gate, so anything in
# ci.yml gates the release. Keeping cargo-deny here means a live advisory-db
# fetch or a flagged advisory can never block a release — this job fails PRs
# and the weekly schedule, but releases stay gated only by ci.yml. deny.toml
# carries no ignore list, so a finding is a real finding.

on:
  push:
    paths:
      - Cargo.lock
      - Cargo.toml
      - deny.toml
      - .github/workflows/deps.yml
  pull_request:
    paths:
      - Cargo.lock
      - Cargo.toml
      - deny.toml
      - .github/workflows/deps.yml
  schedule:
    # Weekly, off the :00/:30 marks.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo-deny:
    name: cargo deny check
    runs-on: ubuntu-latest
    # Gating: advisory, license, ban, and source findings fail the job. deny.toml
    # carries no ignore list, so a new finding is a real finding.

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install cargo-deny
        # taiki-e/install-action@v2.85.9
        uses: taiki-e/install-action@742a3317eac7bd62f91cd888b4eead5e784ba833
        with:
          tool: cargo-deny@0.20.2

      - name: Check advisories, licenses, bans, and sources
        run: cargo deny check
