# uhm configuration — copy to the path shown by `uhm config show`
# Every key is optional; uncomment to override a default.

# model: gpt-5.6-luna
# base_url: https://api.openai.com/v1
# max_completion_tokens: 1024
# reasoning_effort: low          # none | minimal | low | medium | high | xhigh
# stream: true

# shell: auto                    # auto | bash | zsh | fish | pwsh
# include_ls: true
# context_mode: full             # full | request_only
# include_history: false         # persist executed commands; off by default
# history_lines: 15              # default count shown by `uhm history`
# context_timeout_ms: 800

# cache_enabled: true            # caches the RESPONSE only, never the prompt
# cache_ttl_secs: 86400

# Dictionary: short triggers expanded locally (no API call or API key needed).
# The expansion still passes through local effect detection and invocation policy.
aliases:
  gst: git status -sb
  ll: ls -lAhF
  ports: ss -tulpn
