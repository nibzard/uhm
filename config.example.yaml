# uhm configuration — copy to the path shown by `uhm config show`
# Every key is optional; uncomment to override a default.

# model: gpt-5.6-terra
# max_completion_tokens: 1024
# reasoning_effort: low          # none | minimal | low | medium | high | xhigh
# stream: true

# shell: auto                    # auto | bash | zsh | fish | pwsh
# context_mode: standard         # minimal | standard | full
# context_timeout_ms: 150        # one shared context-probe deadline
# stdin_max_bytes: 8388608       # exact stdin spool limit
# request_max_bytes: 262144      # complete untrusted model-input JSON
# response_max_bytes: 2097152    # streamed or buffered API response

# history:                       # metadata only; never intent/command/output
#   enabled: true
#   max_records: 500
#   max_age_days: 30

# execution:
#   timeout_secs: 300
#   diagnostic_bytes: 65536      # tail per redirected stream
#   deny_env: []                 # additional names removed from child env

# cache_enabled: true            # caches the RESPONSE only, never the prompt
# cache_ttl_secs: 86400

# Dictionary: short triggers expanded locally (no API call or API key needed).
# The expansion still passes through local effect detection and invocation policy.
aliases:
  gst: git status -sb
  ll: ls -lAhF
  ports: ss -tulpn
