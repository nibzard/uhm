# uhm configuration — copy to the path shown by `uhm config show`
# Every key is optional; uncomment to override a default.

# model: gpt-5.6-terra
# max_completion_tokens: 8192
# reasoning_effort: low          # none | minimal | low | medium | high | xhigh
# stream: true

# shell: auto                    # auto | bash | zsh | fish | pwsh
# context_mode: standard         # minimal | standard | full
# context_timeout_ms: 150        # one shared context-probe deadline

# shell_context:
#   last_history_entry: false    # sensitive opt-in; previews one entry before sending
# stdin_max_bytes: 16777216      # exact stdin spool limit
# request_max_bytes: 262144      # complete untrusted model-input JSON
# response_max_bytes: 2097152    # streamed or buffered API response

# history:                       # richer levels are explicit and stay local
#   enabled: true
#   detail: metadata             # metadata | diagnostic | full
#   capture_output: false        # applies only to diagnostic/full
#   redact_paths: true
#   max_records: 500
#   max_age_days: 30
#   max_bytes: 268435456
#   artifact_max_bytes: 1048576

# execution:
#   timeout_secs: 300
#   diagnostic_bytes: 65536      # tail per redirected stream
#   deny_env: []                 # additional names removed from child env

# telemetry:
#   enabled: true                # content-free aggregate outcomes; see `uhm telemetry preview`

# program:                       # Python 3 microprogram operational guardrails; not a sandbox
#   enabled: true
#   source_max_bytes: 65536
#   input_max_paths: 64
#   output_max_paths: 16
#   workspace_max_bytes: 67108864
#   timeout_secs: 10
#   cpu_secs: 5
#   address_space_bytes: 268435456
#   open_files: 64
#   child_processes: 16
#   output_max_bytes: 16777216
#   diagnostic_bytes: 1048576

# recovery:                      # separate disclosed opt-in; snapshots contain file bytes
#   enabled: false               # run `uhm recovery on` to record consent
#   max_age_days: 14
#   max_total_bytes: 134217728
#   max_file_bytes: 8388608
#   scan_limit: 1000
#   prune_batch: 100

# cache_enabled: true            # caches the RESPONSE only, never the prompt
# cache_ttl_secs: 86400

# Dictionary: short triggers expanded locally (no API call or API key needed).
# The expansion still passes through local effect detection and invocation policy.
aliases:
  gst: git status -sb
  ll: ls -lAhF
  ports: ss -tulpn
