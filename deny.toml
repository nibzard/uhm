# cargo-deny supply-chain configuration.
#
# Run locally with:  cargo deny check
# CI runs the same via .github/workflows/deps.yml (a decoupled, non-gating job
# that is intentionally NOT wired into ci.yml or the release gate).
#
# Baseline (verified against Cargo.lock on 2026-08-06):
#   - 103 package entries, single crate (no [workspace]).
#   - No RUSTSEC advisories (security or unmaintained) after rustls-pemfile was
#     migrated to rustls::pki_types::pem::PemObject and dropped from the tree.
#   - Duplicate versions (syn 2/3, webpki-roots 0.26/1.0, windows-sys x3) warn only.
#
# Coverage gap: cargo-deny validates advisories / licenses / bans / sources, but
# it cannot detect a legitimate-looking typosquat or dependency-confusion crate
# published to crates.io (it validates *that* a crate is on an allowed registry,
# not *what* the crate is). Add cargo-vet or the github dependency-review-action
# if build-reproducibility / provenance vetting is needed.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
unmaintained = "all"

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "CDLA-Permissive-2.0", # required for webpki-roots
]

[bans]
multiple-versions = "warn"
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = [
  "https://github.com/rust-lang/crates.io-index",
  "sparse+https://index.crates.io/",
]
