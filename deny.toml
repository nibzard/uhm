# cargo-deny supply-chain configuration.
#
# Run locally with:  cargo deny check
# CI runs the same via .github/workflows/deps.yml (a decoupled, non-gating job
# that is intentionally NOT wired into ci.yml or the release gate).
#
# Day-one baseline (verified against Cargo.lock on 2026-08-06):
#   - 104 package entries, single crate (no [workspace]).
#   - No RUSTSEC *security* vulnerabilities.
#   - One open *unmaintained* advisory, RUSTSEC-2025-0134 (rustls-pemfile 2.2.0,
#     pulled directly via Cargo.toml and transitively via rustls-native-certs).
#     It is ignored below pending migration to
#     rustls_pki_types::pem::PemObject; drop the ignore once migrated.
#   - Duplicate versions (syn 2/3, webpki-roots 0.26/1.0, windows-sys x3) warn only.
#
# Coverage gap: cargo-deny validates advisories / licenses / bans / sources but
# CANNOT detect typosquatted, dependency-confused, or silently-substituted
# crates. (In-repo, serde_json resolves to the "zmij" crate in place of ryu and
# still passes all four checks.) Add cargo-vet or github dependency-review-action
# if substitution detection is needed.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
unmaintained = "all"
# TODO: migrate rustls-pemfile -> rustls_pki_types::pem::PemObject and drop this.
ignore = ["RUSTSEC-2025-0134"]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "CDLA-Permissive-2.0", # required for webpki-roots
]

[bans]
multiple-versions = "warn"
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = [
  "https://github.com/rust-lang/crates.io-index",
  "sparse+https://index.crates.io/",
]
