<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="uhm — a fast natural-language layer over terminal tools. Say what you need; get the result."
    />
    <title>uhm — say what you need, get the result</title>

    <!-- Social/SEO preview -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="uhm — say what you need, get the result" />
    <meta
      property="og:description"
      content="A fast natural-language layer over terminal tools. Say what you need; get the result."
    />
    <meta property="og:url" content="https://nibzard.github.io/uhm/" />
    <meta
      property="og:image"
      content="https://nibzard.github.io/uhm/docs/demo/uhm-demo.gif"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="uhm — say what you need, get the result" />
    <meta
      name="twitter:description"
      content="A fast natural-language layer over terminal tools."
    />
    <meta
      name="twitter:image"
      content="https://nibzard.github.io/uhm/docs/demo/uhm-demo.gif"
    />
    <meta name="theme-color" content="#ec5a3c" />
    <link rel="canonical" href="https://nibzard.github.io/uhm/" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!-- docsify dark layout as a base; assets/docs.css overrides it to the uhm warm-dark system. -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/dark.css" />
    <link rel="stylesheet" href="assets/docs.css?v=5" />
  </head>
  <body>
    <div id="app">Loading… if this persists, JavaScript is required for the docs reader.</div>
    <script>
      window.$docsify = {
        name: "uhm",
        nameLink: "#/",
        repo: "https://github.com/nibzard/uhm",
        coverpage: true,
        loadSidebar: true,
        maxLevel: 3,
        subMaxLevel: 3,
        auto2top: true,
        notFoundPage: true,
        themeColor: "#ec5a3c",
        search: {
          maxAge: 86400000, // 1 day
          paths: "auto",
          placeholder: "Search the docs…",
          noData: "No matches",
          depth: 3,
        },
        plugins: [
          // "Edit this page on GitHub" footer link on every rendered page.
          function (hook, vm) {
            hook.afterEach(function (html, next) {
              if (vm.route.file) {
                var url =
                  "https://github.com/nibzard/uhm/edit/main/docs/" + vm.route.file;
                next(
                  html +
                    '<p class="edit-page"><a href="' +
                    url +
                    '" target="_blank" rel="noopener">Edit this page on GitHub ✎</a></p>',
                );
              } else {
                next(html);
              }
            });
          },
        ],
      };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/zoom-image.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  </body>
</html>
